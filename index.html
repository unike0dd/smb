<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gabriel Services role-based HR dashboard suite for Freelance, Independent HR, HR Pro, Growing SMB, and Consumer/Talent users.">
  <title>Gabriel Services — Growing SMB Dashboard</title>
  <style>
    :root{--ink:#182737;--muted:#718092;--line:#e7eaee;--cream:#fbf7f1;--nav:#233446;--nav2:#1e2e3d;--orange:#f17a3a;--green:#4c9a70;--white:#fff;--shadow:0 5px 18px rgba(40,56,72,.06)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#25384b,var(--nav2));color:#dbe3e9;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:16px;padding:0 8px 30px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#ff9b52,#e9622b);color:#fff;font:24px Georgia,serif;box-shadow:0 7px 16px rgba(239,115,56,.24)}.brand small,.profile small{display:block;color:#8fa0ad;font-size:10px;font-weight:500;margin-top:2px}.nav{display:grid;gap:5px}.nav button,.bottom button{border:0;background:transparent;color:#b6c2cb;text-align:left;padding:11px 13px;border-radius:10px;font-size:14px;cursor:pointer;transition:.2s}.nav button:hover,.nav button.active,.bottom button:hover{background:#32485d;color:#fff}.bottom{margin-top:auto;border-top:1px solid #3b4c5b;padding-top:12px;display:grid}.profile{display:flex;align-items:center;gap:10px;padding:16px 10px 0}.profile-avatar,.header-avatar{display:grid;place-items:center;border-radius:50%;background:#ffe4cf;color:#b94e1f;font-size:12px;font-weight:800;width:34px;height:34px}.profile span{font-size:12px;font-weight:700}
    .workspace{min-width:0}.topbar{min-height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 34px;position:sticky;top:0;z-index:10}.tabs{display:flex;gap:5px;background:#f4f5f6;padding:5px;border-radius:12px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;color:#657383;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.2s}.tab:hover{color:#d65f28}.tab[aria-selected="true"]{background:#fff;color:#db6129;box-shadow:0 2px 8px rgba(28,47,66,.13)}.header-actions{display:flex;align-items:center;gap:8px}.icon-btn{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:#fff;color:#657383;border-radius:10px;cursor:pointer;position:relative}.notification-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#ef6d36;right:7px;top:6px}.content{max-width:1440px;margin:auto;padding:34px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#df6a32;font-weight:850}.welcome h1{font:500 32px Georgia,serif;margin:7px 0 5px}.welcome p,.title p{margin:0;color:var(--muted);font-size:13px}.primary{border:0;border-radius:10px;background:#ec7338;color:#fff;padding:12px 18px;font-weight:800;box-shadow:0 8px 18px rgba(226,107,50,.25);cursor:pointer;white-space:nowrap;transition:.2s}.primary:hover{background:#d9612b;transform:translateY(-1px)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px;display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto auto;min-width:0}.stat-icon{grid-row:1/4;width:36px;height:36px;border-radius:10px;background:#fff2e8;color:#e76d34;display:grid;place-items:center;font-style:normal;font-weight:800}.stat-label{color:var(--muted);font-size:11px}.stat strong{font:500 25px Georgia,serif;margin:2px 0;overflow:hidden;text-overflow:ellipsis}.stat small{color:var(--green);font-size:10px}.main-grid,.lower-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px}.title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.title h2{font-size:15px;margin:0 0 4px}.secondary{border:1px solid var(--line);background:#fff;color:#657383;padding:7px 9px;border-radius:8px;font-size:11px;cursor:pointer}.chart-wrap{position:relative;height:165px}.chart{width:100%;height:145px;overflow:visible}.axis{display:flex;justify-content:space-between;color:#9aa5ae;font-size:9px}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #edf0f2;cursor:pointer}.task input{accent-color:#ef7539}.task-copy{display:flex;flex-direction:column;flex:1;font-size:12px}.task-copy small{color:#939da7;margin-top:2px}.task-arrow{font-style:normal;color:#9aa5ae}.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stage span{font-size:10px;color:var(--muted)}.stage strong{display:block;font:24px Georgia,serif;margin:3px 0 9px}.bar{height:5px;background:#f0f1f2;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px;background:var(--orange)}.insight{background:linear-gradient(135deg,#fff8f1,#fff);border-color:#f1d7c5}.insight-kicker{font-size:9px;font-weight:900;color:#db652f;letter-spacing:.11em}.insight h2{font:20px Georgia,serif;margin:9px 0 6px}.insight p{font-size:11px;line-height:1.6;color:#6c7883;margin:0}.text-action{border:0;background:transparent;color:#d6602b;padding:12px 0 0;font-weight:800;font-size:11px;cursor:pointer}.toast{position:fixed;right:22px;bottom:22px;background:#233446;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:0 12px 34px rgba(18,32,45,.25);font-size:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1050px){.shell{grid-template-columns:78px minmax(0,1fr)}.sidebar{padding:22px 12px}.brand{padding:0 8px 28px}.brand-copy,.nav .nav-label,.profile span,.bottom .nav-label{display:none}.nav button,.bottom button{text-align:center}.profile{justify-content:center;padding-left:0}.topbar{padding:12px 18px}.content{padding:24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.shell{display:block}.sidebar{display:none}.topbar{min-height:68px;padding:10px 15px}.tabs{width:calc(100vw - 105px)}.content{padding:20px 15px}.welcome{align-items:flex-start}.welcome h1{font-size:26px}.primary{font-size:0;padding:11px}.primary::first-letter{font-size:18px}.stats,.main-grid,.lower-grid{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}.header-actions .icon-btn:first-child{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">G</span><span class="brand-copy">Gabriel Services<small>People, beautifully managed</small></span></div>
      <nav class="nav" aria-label="Dashboard navigation">
        <button class="active" type="button"><span aria-hidden="true">⌂</span> <span class="nav-label">Overview</span></button>
        <button type="button"><span aria-hidden="true">◎</span> <span class="nav-label">People</span></button>
        <button type="button"><span aria-hidden="true">◇</span> <span class="nav-label">Recruiting</span></button>
        <button type="button"><span aria-hidden="true">✓</span> <span class="nav-label">Tasks</span></button>
        <button type="button"><span aria-hidden="true">▣</span> <span class="nav-label">Time &amp; attendance</span></button>
        <button type="button"><span aria-hidden="true">◫</span> <span class="nav-label">Documents</span></button>
        <button type="button"><span aria-hidden="true">↗</span> <span class="nav-label">Reports</span></button>
      </nav>
      <div class="bottom"><button type="button"><span aria-hidden="true">⚙</span> <span class="nav-label">Settings</span></button><div class="profile"><b class="profile-avatar">GA</b><span>Gabo Admin<small id="profilePlan"></small></span></div></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="tabs" role="tablist" aria-label="Dashboard options" id="tabs"></div>
        <div class="header-actions"><button class="icon-btn" type="button" aria-label="Search">⌕</button><button class="icon-btn" type="button" aria-label="Notifications">♢<i class="notification-dot"></i></button><b class="header-avatar">GA</b></div>
      </header>
      <div class="content">
        <section class="welcome"><div><span class="eyebrow" id="eyebrow"></span><h1 id="greeting"></h1><p id="subtitle"></p></div><button class="primary" id="quickAction" type="button">＋ Quick action</button></section>
        <section class="stats" id="stats" aria-label="Key metrics"></section>
        <div class="main-grid">
          <article class="panel"><div class="title"><div><h2 id="trendTitle">Performance trend</h2><p>Last 7 weeks</p></div><button class="secondary" type="button">Weekly⌄</button></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 330 110" role="img" aria-label="Seven-week performance trend"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f17a3a" stop-opacity=".32"></stop><stop offset="1" stop-color="#f17a3a" stop-opacity="0"></stop></linearGradient></defs><path id="area" fill="url(#chartFill)"></path><polyline id="line" fill="none" stroke="#f17a3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><g id="dots"></g></svg><div class="axis"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span><span>W7</span></div></div></article>
          <article class="panel"><div class="title"><div><h2>Priority tasks</h2><p id="taskSummary"></p></div><button class="secondary" type="button">View all</button></div><div id="tasks"></div></article>
        </div>
        <div class="lower-grid">
          <article class="panel"><div class="title"><div><h2>Talent pipeline</h2><p>Live progress by stage</p></div><button class="secondary" type="button">View pipeline</button></div><div class="pipeline" id="pipeline"></div></article>
          <article class="panel insight"><span class="insight-kicker">✦ SMART INSIGHT</span><h2 id="insightTitle"></h2><p id="insightText"></p><button class="text-action" type="button">View recommendation →</button></article>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const dashboards={
      freelance:{label:"Freelance",plan:"Solo · $8.99/mo",greeting:"Good morning, Maya",subtitle:"Your week is moving in the right direction.",stats:[["Active clients","4","+1 this month"],["Open roles","7","3 need attention"],["Candidates","42","+12 this week"],["Monthly revenue","$4,860","82% of goal"]],chart:[38,55,46,70,64,82,76],tasks:["Review 6 shortlisted candidates","Send Northstar invoice","Prepare Friday client update"],pipeline:[["Sourced",18],["Screening",11],["Interview",7],["Offer",3]],insightTitle:"Your strongest opportunity",insight:"Candidate response is highest on Tuesday mornings. Schedule the next outreach batch for 9:30 AM."},
      independent:{label:"Independent HR",plan:"Independent · $22/mo",greeting:"Your client portfolio",subtitle:"A focused view across every account you manage.",stats:[["Client accounts","9","All active"],["Open requisitions","18","5 priority"],["Time to shortlist","3.2d","↓ 0.8 days"],["Retainer revenue","$12.4k","+14% MoM"]],chart:[42,48,63,58,76,71,88],tasks:["Approve Acme onboarding plan","Schedule 4 candidate screens","Review expiring client agreements"],pipeline:[["Sourced",64],["Screening",35],["Interview",19],["Offer",8]],insightTitle:"Your strongest opportunity",insight:"Candidate response is highest on Tuesday mornings. Schedule the next outreach batch for 9:30 AM."},
      hrpro:{label:"HR Pro",plan:"Professional · Premium",greeting:"People operations command center",subtitle:"Turn workforce signals into timely action.",stats:[["Headcount","286","+8 this quarter"],["Retention","94.6%","↑ 2.1%"],["Engagement","8.4/10","Top quartile"],["Open positions","23","11 on track"]],chart:[68,70,73,71,78,82,86],tasks:["Resolve 3 approval bottlenecks","Launch Q3 pulse survey","Complete workforce plan review"],pipeline:[["Applied",248],["Qualified",96],["Interview",41],["Offer",15]],insightTitle:"Your strongest opportunity",insight:"Interview conversion improved 12%. Keep structured scorecards active across the remaining open roles."},
      smb:{label:"Growing SMB",plan:"Business · Premium",greeting:"Company overview",subtitle:"Your people, payroll and hiring—together.",stats:[["Team members","68","+5 this month"],["Payroll ready","96%","2 items pending"],["Time off today","6","9% of team"],["Open roles","8","4 interviews today"]],chart:[52,56,61,67,65,74,81],tasks:["Approve payroll by 3:00 PM","Sign 2 offer letters","Review warehouse staffing gap"],pipeline:[["Applicants",83],["Shortlist",28],["Interview",14],["Offer",5]],insightTitle:"Your strongest opportunity",insight:"Interview conversion improved 12%. Keep structured scorecards active across the remaining open roles."},
      talent:{label:"Consumer / Talent",plan:"Talent · Free",greeting:"Welcome back, Jordan",subtitle:"Your next opportunity is getting closer.",stats:[["Profile strength","88%","Add one reference"],["Applications","12","4 in review"],["Interviews","3","Next: Tuesday"],["Profile views","46","+18 this week"]],chart:[22,31,29,44,51,63,78],tasks:["Confirm Tuesday interview","Finish skills assessment","Tailor profile for HR Coordinator"],pipeline:[["Saved",9],["Applied",12],["Interview",3],["Offer",1]],insightTitle:"You match 6 new roles",insight:"Completing your reference will raise profile visibility and unlock stronger recommendations."}
    };
    const icons=["◉","↗","♡","$"];let active="smb";const $=id=>document.getElementById(id);
    function buildTabs(){$("tabs").innerHTML=Object.entries(dashboards).map(([key,d])=>`<button class="tab" type="button" role="tab" data-key="${key}" aria-selected="${key===active}">${d.label}</button>`).join("");$("tabs").addEventListener("click",e=>{const button=e.target.closest("[data-key]");if(!button)return;active=button.dataset.key;render();});}
    function renderChart(values){const points=values.map((v,i)=>`${i*54},${105-v}`).join(" ");$("line").setAttribute("points",points);$("area").setAttribute("d",`M0,110 L${points} L324,110 Z`);$("dots").innerHTML=values.map((v,i)=>`<circle cx="${i*54}" cy="${105-v}" r="4" fill="#fff" stroke="#f17a3a" stroke-width="3"></circle>`).join("");}
    function render(){const d=dashboards[active];document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.key===active)));$("profilePlan").textContent=d.plan;$("eyebrow").textContent=`${d.label} dashboard`;$("greeting").textContent=d.greeting;$("subtitle").textContent=d.subtitle;$("stats").innerHTML=d.stats.map((s,i)=>`<article class="stat"><i class="stat-icon">${icons[i]}</i><span class="stat-label">${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small></article>`).join("");$("taskSummary").textContent=`${d.tasks.length} items need attention`;$("tasks").innerHTML=d.tasks.map((task,i)=>`<label class="task"><input type="checkbox"><span class="task-copy"><b>${task}</b><small>${i===0?"Today":"This week"}</small></span><em class="task-arrow">›</em></label>`).join("");$("pipeline").innerHTML=d.pipeline.map((stage,i)=>`<div class="stage"><span>${stage[0]}</span><strong>${stage[1]}</strong><div class="bar"><i style="width:${Math.max(18,100-i*22)}%"></i></div></div>`).join("");$("insightTitle").textContent=d.insightTitle;$("insightText").textContent=d.insight;renderChart(d.chart);}
    function notify(message){const toast=$("toast");toast.textContent=message;toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove("show"),2200)}
    $("quickAction").addEventListener("click",()=>notify(`Quick action opened for ${dashboards[active].label}`));document.querySelectorAll(".nav button,.bottom button,.secondary,.text-action,.icon-btn").forEach(button=>button.addEventListener("click",()=>notify(`${button.textContent.trim()||button.getAttribute("aria-label")} selected`)));document.addEventListener("change",e=>{if(e.target.matches('.task input'))notify(e.target.checked?"Task marked complete":"Task restored")});
    buildTabs();render();
  </script>
</body>
</html>
