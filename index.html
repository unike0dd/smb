  const original=new WeakMap();
  let lang=localStorage.getItem(KEY_LANG)||"en";
  let theme=localStorage.getItem(KEY_THEME)||"light";
  const translateText=node=>{
    if(!node.nodeValue||!node.nodeValue.trim()||node.parentElement?.closest("[data-ui-control]"))return;
    if(!original.has(node))original.set(node,node.nodeValue);
    const base=original.get(node),trim=base.trim(),mapped=translations[trim];
    node.nodeValue=lang==="es"&&mapped?base.replace(trim,mapped):base;
  };
  const translateTree=scope=>{
    const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);
    let node;while(node=walker.nextNode())translateText(node);
    root.lang=lang;
  };
  const controls=document.createElement("div");
  controls.className="ui-preferences";controls.dataset.uiControl="";
  controls.innerHTML='<button class="ui-toggle" id="languageToggle" type="button" aria-label="Cambiar idioma a español">EN</button><button class="ui-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">Light</button>';
  const host=document.querySelector(".top-actions")||document.querySelector(".site-header")||document.body;
  host.appendChild(controls);
  const languageButton=controls.querySelector("#languageToggle"),themeButton=controls.querySelector("#themeToggle");
  const applyTheme=()=>{root.dataset.theme=theme;themeButton.textContent=theme==="light"?"Light":"Dark";themeButton.setAttribute("aria-label",theme==="light"?(lang==="es"?"Cambiar a tema oscuro":"Switch to dark theme"):(lang==="es"?"Cambiar a tema claro":"Switch to light theme"));document.querySelector('meta[name="theme-color"]')?.setAttribute("content",theme==="dark"?"#121b22":"#153f36")};
  const applyLanguage=()=>{languageButton.textContent=lang.toUpperCase();languageButton.setAttribute("aria-label",lang==="en"?"Cambiar idioma a español":"Switch language to English");translateTree(document.body);applyTheme()};
  languageButton.addEventListener("click",()=>{lang=lang==="en"?"es":"en";localStorage.setItem(KEY_LANG,lang);applyLanguage()});
  themeButton.addEventListener("click",()=>{theme=theme==="light"?"dark":"light";localStorage.setItem(KEY_THEME,theme);applyTheme()});
  new MutationObserver(records=>{if(lang!=="es")return;records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE)translateText(n);else if(n.nodeType===Node.ELEMENT_NODE)translateTree(n)}))}).observe(document.body,{childList:true,subtree:true});
  applyTheme();applyLanguage();
})();
